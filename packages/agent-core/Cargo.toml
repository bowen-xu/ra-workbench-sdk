[package]
name = "research-agent-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Application-owned research agent domain and runtime contracts"

[dependencies]
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v5"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
