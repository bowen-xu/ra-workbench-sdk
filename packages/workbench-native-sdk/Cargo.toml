[package]
name = "research-workbench-native-sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Finite native workbench plugin protocol and shared pure resource contracts"

[dependencies]
base64 = "=0.22.1"
ciborium = "=0.2.2"
research-agent-core = { path = "../agent-core" }
research-semantic-engine-api = { path = "../semantic-engine-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
